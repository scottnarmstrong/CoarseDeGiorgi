name: Build and verify

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and axiom audit
    runs-on: ubuntu-24.04
    # The first run on an empty cache compiles the CoarseGraining dependency
    # and the whole project from source and may take several hours.
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The build, the exported environments and the second kernel need more
      # disk than a hosted runner has free at start. Only remove preinstalled,
      # unused SDKs on disposable hosted runners, and fail at once if less than
      # 20 GB is available.
      - name: Free runner disk space
        run: |
          set -Eeuo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force > /dev/null || true
          fi
          df -h .
          available_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          test "$available_kib" -ge 20971520

      # Install the toolchain from `lean-toolchain` and fetch the Mathlib
      # cache (`lake exe cache get`). The CoarseGraining dependency has no
      # cache service and is built from source on the first run.
      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true

      # Restore and save are separate steps so that the save runs even when a
      # later step fails: an interrupted build still keeps its completed
      # modules. The comparator workflow caches the same paths, so its cache
      # is a valid fallback.
      - name: Restore project and dependency build artifacts
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/CoarseGraining/.lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-cmp-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # The library must build without any warning: no `sorry` and no linter
      # warning. Warnings of the dependencies are not counted. The step has its
      # own time limit, below the job's, so that a first build that runs out of
      # time still reaches the step that saves its artifacts.
      - name: Build the library
        timeout-minutes: 300
        run: |
          set -o pipefail
          lake build 2>&1 | tee library-build.log
          if grep -E '^warning: (\./)?CoarseDeGiorgi' library-build.log; then
            echo "The library build reported warnings."
            exit 1
          fi

      # The comparator challenges and their solutions (not a default target).
      # Each challenge contains exactly one intentional `sorry`, reported as a
      # warning; any other warning fails the step.
      - name: Build the audit library
        run: |
          set -o pipefail
          lake build CoarseDeGiorgiAudit 2>&1 | tee audit-build.log
          if grep -E '^warning: (\./)?CoarseDeGiorgi' audit-build.log \
               | grep -vE '^warning: (\./)?CoarseDeGiorgiAudit/Challenge/[A-Za-z]+\.lean:[0-9]+:[0-9]+: declaration uses .sorry.$'; then
            echo "A warning other than the intentional sorry of a challenge was reported."
            exit 1
          fi

      # Elaborate the axiom audit and check its `#print axioms` output: every
      # declaration listed there must be reported, and each may depend only on
      # propext, Classical.choice and Quot.sound. Long names make Lean wrap the
      # axiom list over several lines, so the check parses the whole log
      # instead of matching single lines.
      - name: Axiom audit
        run: |
          set -o pipefail
          lake env lean CoarseDeGiorgiAudit/AxiomsAudit.lean 2>&1 | tee axioms-audit.log
          python3 - axioms-audit.log CoarseDeGiorgiAudit/AxiomsAudit.lean <<'PY'
          import re
          import sys

          log = open(sys.argv[1], encoding="utf-8").read()
          source = open(sys.argv[2], encoding="utf-8").read()
          expected = re.findall(r"^#print axioms\s+(\S+)", source, re.MULTILINE)
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          found = {}
          for match in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]", log):
              found[match.group(1)] = {a.strip() for a in match.group(2).split(",") if a.strip()}
          for match in re.finditer(r"'([^']+)' does not depend on any axioms", log):
              found[match.group(1)] = set()
          failed = not expected
          for name in expected:
              if name not in found:
                  print(f"FAIL {name}: no axiom report")
                  failed = True
              elif not found[name] <= allowed:
                  print(f"FAIL {name}: unexpected axioms {sorted(found[name] - allowed)}")
                  failed = True
              else:
                  print(f"ok   {name}: {sorted(found[name])}")
          extra = sorted(set(found) - set(expected))
          if extra:
              print(f"FAIL unexpected reports: {extra}")
              failed = True
          print(f"{len(expected)} declarations audited")
          sys.exit(1 if failed else 0)
          PY

      - name: Save project and dependency build artifacts
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            .lake/packages/CoarseGraining/.lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
