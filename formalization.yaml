# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "De Giorgi–Nash–Moser theory under coarse ellipticity"
  description: >-
    A Lean formalization of the paper of Armstrong, Avelin, Kuusi and
    Turpeinen on divergence-form elliptic equations whose symmetric
    coefficients may be degenerate and unbounded. Theorems A and C of the
    paper, the latter with its whole range of weak Harnack exponents up to
    the endpoint, Corollary B, Theorem D (integrability, cube quasi-norms and
    negative Sobolev norms) and Corollary E (coefficients in negative Sobolev
    spaces) for finite exponents, Theorem F (sharpness of the range),
    Proposition 11.2 (optimality of the powers), Proposition 11.3 (optimality
    of the range of weak Harnack exponents), Appendix B (averages over
    simplices or cubes and Gaussian averages) for finite exponents, and
    Proposition 3.4 with Appendix C (cubes in place of simplices) for
    summability index one and finite exponents are proved in Lean, together
    with the intermediate results of the paper in the forms their proofs use,
    relying only on Lean's standard axioms. Not formalized: infinite
    exponents in Theorem D, Appendix B, Proposition 3.4 and Lemma C.1, other
    summability indices in Proposition 3.4, and remarks and comparisons with
    other work;
    CORRESPONDENCE.md gives the status of every numbered statement. The
    central results: subsolutions are locally bounded above, nonnegative
    supersolutions satisfy the weak Harnack inequality for every exponent up
    to an optimal endpoint, and nonnegative solutions satisfy the Harnack
    inequality, with explicit dependence on a coarse ellipticity
    ratio. Instead of pointwise
    bounds, the hypothesis is a moment condition on two coarse-grained
    matrices of the coefficients, computed on the simplices of triadic
    triangulations. It holds under a Besov-type negative-regularity condition
    on the coefficients and their inverses, and this condition is sharp in its
    whole range: in every dimension d >= 3, outside the range and on its
    boundary, explicit scalar coefficients have unbounded solutions. Its case
    of order zero, of Lebesgue moments, is the optimal moment range of Bella
    and Schäffner, whose sharpness is thereby also proved, endpoint included.
    The powers of the coarse ellipticity ratio in the local bound and
    the range of exponents in the weak Harnack inequality are also shown to be
    optimal. It builds on the CoarseGraining library. The manuscript is
    included as a PDF.
  authors:
    - "Scott Armstrong"
    - "Benny Avelin"
    - "Tuomo Kuusi"
    - "Aatu Turpeinen"
  responsible_maintainers:
    - "Scott Armstrong"
    - "Benny Avelin"
    - "Tuomo Kuusi"
    - "Aatu Turpeinen"
  affiliations:
    - "Scott Armstrong: CNRS and Laboratoire Jacques-Louis Lions, Sorbonne Université; Courant Institute School of Mathematics, Computing, and Data Science, New York University"
    - "Benny Avelin: Department of Mathematics, Uppsala University"
    - "Tuomo Kuusi: Department of Mathematics and Statistics, University of Helsinki"
    - "Aatu Turpeinen: Department of Mathematics and Statistics, University of Helsinki"
  license: "Apache-2.0"
  funding:
    - "Scott Armstrong and Tuomo Kuusi were supported by the European Research Council (ERC) under the European Union's Horizon Europe research and innovation programme, grant agreement No. 101200828."
    - "Tuomo Kuusi and Aatu Turpeinen were supported by the Academy of Finland."

classification:
  arxiv: ["math.AP"]
  msc2020: ["35J70", "35B65", "35J15", "35B45"]

sources:
  - title: "Coarse ellipticity and De Giorgi–Nash–Moser theory in the optimal range"
    authors:
      - "Scott Armstrong"
      - "Benny Avelin"
      - "Tuomo Kuusi"
      - "Aatu Turpeinen"
    type: "paper"
    id: "arxiv:2610.11879"
    url: "https://arxiv.org/abs/2610.11879"
    location: "paper/coarse-grained-dgnm.pdf"
    relationship: "formalizes"
    note: >-
      The manuscript under formalization, included in the repository as a
      PDF. Its introduction states Theorem A (local boundedness above),
      Corollary B (L^eta bounds), Theorem C (weak Harnack and Harnack
      inequalities), Theorem D (conditions on the coefficients: (i)
      integrability, (ii) cube quasi-norms of negative order, (iii) negative
      Sobolev norms), Corollary E (coefficients in negative Sobolev spaces)
      and Theorem F (sharpness of the range). Formalized: Theorems A, C (for
      every weak Harnack exponent 0 < eta <= r*/2) and F, Corollaries B and
      E, the three parts of Theorem D for finite exponents, Proposition 11.2
      (optimality of the powers of the coarse ellipticity ratio in
      Theorem A and Corollary B), Proposition 11.3 (optimality of the range of
      weak Harnack exponents), Proposition B.1 and Lemma B.2 (Gaussian
      averages and negative Sobolev norms) for finite exponents, and
      Proposition 3.4 with Appendix C (cubical and simplicial constants) for
      summability index one and finite exponents. Not formalized: the
      infinite exponents in Theorem D and in Appendix B, and the remark after
      Proposition B.1 comparing Gaussian averages with the Besov space defined
      through the Fourier transform (cited from Kerkyacharian and Petrushev).
      Section 1.5 of the included manuscript says that all its results are
      formalized, with summability index one and, for Proposition 3.4 and
      Appendix C, finite exponents; the exceptions are the infinite exponents
      just listed.
    license: "all rights reserved"
    author_endorsement: "participated"
  - title: "Local boundedness and Harnack inequality for solutions of linear non-uniformly elliptic equations"
    authors:
      - "Peter Bella"
      - "Mathias Schäffner"
    type: "paper"
    id: "arxiv:1901.07958"
    relationship: "background"
    note: >-
      Proves local boundedness and the Harnack inequality in the moment range
      1/p + 1/q < 2/(d-1), for possibly nonsymmetric coefficients and d >= 2.
      Part (i) of Theorem D recovers this range for symmetric coefficients
      with d >= 3 and finite exponents, for a different solution class, and
      Theorem F gives explicit scalar examples beyond it and on its boundary,
      in every dimension d >= 3; the paper's arguments are not formalized
      here.
    license: ""
    author_endorsement: "not-contacted"
  - title: "Hitchhiker's guide to the fractional Sobolev spaces"
    authors:
      - "Eleonora Di Nezza"
      - "Giampiero Palatucci"
      - "Enrico Valdinoci"
    type: "paper"
    id: "arxiv:1104.4345"
    relationship: "background"
    note: >-
      Theorems 6.5 and 6.7 of Di Nezza, Palatucci and Valdinoci (the latter
      on the unit cube), the fractional Sobolev inequality, are formalized
      and proved here; the manuscript uses them in the cube and on the cube
      boundary.
    license: ""
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/scottnarmstrong/CoarseGraining"
    relationship: "builds-on"
    note: >-
      The CoarseGraining library (Armstrong, Kuusi) supplies the coefficient
      fields, weak derivatives and Sobolev spaces, triadic cubes, cube
      averages and Poincaré inequalities; pinned as a Lake dependency.
  - id: "https://github.com/scottnarmstrong/DeGiorgi"
    relationship: "supersedes"
    note: >-
      For symmetric coefficients in d >= 3, the uniformly elliptic comparator
      theorems here give the Harnack inequality with constant
      exp(C sqrt(Lambda/lambda)), the weak Harnack inequality with constants
      of the same form for every exponent below d/(d-2), and local
      boundedness with every power kappa > (d-1)/4 of 1 + Lambda/lambda, as
      consequences of results for degenerate and unbounded coefficients. Not
      superseded: DeGiorgi's Hölder continuity, its nonsymmetric
      coefficients, and its statements on balls for H^1 weak solutions.

status:
  scope: >-
    Formalized and proved: Theorem A with Corollary B for every 0 < eta < 2,
    the weak Harnack inequality of Theorem C for every exponent
    0 < eta <= r*/2, endpoint included, and the Harnack inequality, the three
    parts of Theorem D for finite exponents (the coarse ellipticity
    constants bounded by Lebesgue norms, by cube quasi-norms and by negative
    Sobolev norms of the coefficients), Corollary E (local boundedness and
    the Harnack inequality for coefficients in negative Sobolev spaces, with
    d - 1 in place of d), Proposition B.1 and Lemma B.2 for finite exponents
    (averages over simplices or cubes against Gaussian averages, and cube
    quasi-norms against negative Sobolev norms), the range condition of part
    (i) (indices with a positive slack exist only below the Bella-Schäffner
    threshold), and
    Theorem F, the sharpness of the range, boundary included, by explicit
    scalar coefficients with unbounded solutions. Proposition 11.2, the
    optimality of the powers of the coarse ellipticity ratio in
    Theorem A and Corollary B, and Proposition 11.3, the optimality of the
    range of weak Harnack exponents for each choice of the parameters, are
    also formalized and proved, as are Proposition 3.4, Lemma C.1 and (3.20)
    for summability index one and finite exponents (the constants computed
    on triadic cubes are equivalent to those on simplices) and Theorems A
    and C and Corollary B under the cubical hypothesis. Not formalized:
    infinite exponents in Theorem D, Appendix B, Proposition 3.4 and Lemma
    C.1, and the comparison with the Fourier-analytic Besov space after
    Proposition B.1. The supporting development
    includes the weighted energy space, the
    coarse-grained matrices on simplices, the embedding into fractional
    Sobolev spaces, the fractional Sobolev inequality of
    Di Nezza-Palatucci-Valdinoci, the choice of a good radius, the
    interpolation on Whitney simplices with the piecewise affine and
    piecewise harmonic extensions, the Caccioppoli and energy-to-supremum
    iterations, the logarithmic and power estimates behind the Harnack
    inequality, and, for the endpoint of the weak Harnack inequality, the
    rescaling of the estimates to small cubes, a reconstruction of functions
    with zero boundary values scale by scale, potentials of measures and a
    capacitary comparison, and, for the negative Sobolev norms, Sobolev
    norms of every order through weak derivative arrays, Gaussian kernels and
    their derivatives, and duality. Mathlib-only restatements of the main
    results are checked by leanprover/comparator (see COMPARATORS.md).
  sorry_count: 0
  sorry_in_definitions: 0
